name: Tests + Spectra

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage to Spectra
        uses: spectra-hq/spectra-action@v1
        with:
          token: ${{ secrets.SPECTRA_TOKEN }}
          api-url: https://spectra.tech5.us
          coverage: ./coverage/lcov.info
          gate: "true"
